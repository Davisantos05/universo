<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nosso Universo 💖 Davi & Stella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <audio id="bg-music" loop preload="auto">
    <source src="assets/musica.mp3" type="audio/mp3">
  </audio>

  <div id="universe-hint" class="universe-hint hidden">
    <span>✨ Explore nosso universo. Toque nos planetas ou use o menu!</span>
  </div>

  <nav id="mobile-planets" class="mobile-planets hidden" aria-label="Planetas do nosso universo">
    <div id="mobile-planet-menu" class="mobile-planet-menu hidden"></div>
    <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-expanded="false" aria-controls="mobile-planet-menu">🪐 Escolher um planeta</button>
  </nav>

  <div id="planet-tooltip" class="planet-tooltip hidden">Planeta</div>

  <div id="intro-screen" class="screen-overlay">
    <div class="romantic-card" id="start-card">
      <div class="card-illustration">
        <svg viewBox="0 0 200 160" width="140" xmlns="http://www.w3.org/2000/svg">
          <g class="bunny bunny-left">
            <ellipse cx="65" cy="115" rx="26" ry="24" fill="#ffffff"/>
            <ellipse cx="55" cy="80" rx="7" ry="20" fill="#ffffff" transform="rotate(-10 55 80)"/>
            <ellipse cx="55" cy="80" rx="4" ry="15" fill="#ffbccc" transform="rotate(-10 55 80)"/>
            <ellipse cx="72" cy="79" rx="7" ry="20" fill="#ffffff" transform="rotate(8 72 79)"/>
            <ellipse cx="72" cy="79" rx="4" ry="15" fill="#ffbccc" transform="rotate(8 72 79)"/>
            <circle cx="58" cy="110" r="3" fill="#222"/>
            <circle cx="72" cy="110" r="3" fill="#222"/>
            <ellipse cx="53" cy="116" rx="5" ry="3" fill="#ff8ba7" opacity="0.7"/>
            <ellipse cx="77" cy="116" rx="5" ry="3" fill="#ff8ba7" opacity="0.7"/>
            <ellipse cx="65" cy="115" rx="2.5" ry="2" fill="#ff75a0"/>
          </g>
          <g class="bunny bunny-right">
            <ellipse cx="125" cy="115" rx="26" ry="24" fill="#fdf4f7"/>
            <ellipse cx="118" cy="79" rx="7" ry="20" fill="#fdf4f7" transform="rotate(-8 118 79)"/>
            <ellipse cx="118" cy="79" rx="4" ry="15" fill="#ffbccc" transform="rotate(-8 118 79)"/>
            <ellipse cx="135" cy="80" rx="7" ry="20" fill="#fdf4f7" transform="rotate(10 135 80)"/>
            <ellipse cx="135" cy="80" rx="4" ry="15" fill="#ffbccc" transform="rotate(10 135 80)"/>
            <circle cx="118" cy="110" r="3" fill="#222"/>
            <circle cx="132" cy="110" r="3" fill="#222"/>
            <ellipse cx="113" cy="116" rx="5" ry="3" fill="#ff8ba7" opacity="0.7"/>
            <ellipse cx="137" cy="116" rx="5" ry="3" fill="#ff8ba7" opacity="0.7"/>
            <ellipse cx="125" cy="115" rx="2.5" ry="2" fill="#ff75a0"/>
          </g>
        </svg>
      </div>
      <div class="card-content">
        <h1 class="card-title">Nosso Universo</h1>
        <p class="card-date">Davi & Stella</p>
      </div>
      <button id="btn-enter" class="btn-love">
        <span>Viajar para a nossa galáxia 🚀</span>
      </button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="planet-modal" class="modal-overlay hidden">
    <div class="modal-dashboard">
      <div class="modal-header" id="modal-header">
        <div class="modal-icon" id="modal-icon">🪐</div>
        <h2 id="modal-title" class="modal-title">Nome do Planeta</h2>
        <button id="modal-close" class="modal-close-btn" aria-label="Fechar planeta">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Bibliotecas Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <!-- Pós-processamento (Efeito Bloom/Neon) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
